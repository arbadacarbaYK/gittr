name: Build and Release APK

# Thin WebView APK for Zapstore / GitHub app-store indexers.
# gittr is a hosted Next.js forge — this does not static-export the site.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Version from tag
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version_name=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            MA="${VERSION%%.*}"
            REST="${VERSION#*.}"
            MI="${REST%%.*}"
            PA="${REST#*.}"
            echo "version_code=$((MA * 10000 + MI * 100 + PA))" >> "$GITHUB_OUTPUT"
          else
            echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
          echo "apk_name=gittr-${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Unpack private keystore if provided
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/gittr-release.p12
            echo "ANDROID_KEYSTORE_FILE=/tmp/gittr-release.p12" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Using ANDROID_KEYSTORE_BASE64 secret"
          else
            echo "Using committed android-app/keystore/gittr-ci.p12"
          fi

      - name: Build release APK
        working-directory: android-app
        run: |
          gradle assembleRelease \
            -PversionName="${{ steps.ver.outputs.version_name }}" \
            -PversionCode="${{ steps.ver.outputs.version_code }}"

      - name: Name APK
        id: apk
        run: |
          SRC="android-app/app/build/outputs/apk/release/app-release.apk"
          test -f "$SRC"
          DEST="${{ steps.ver.outputs.apk_name }}"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gittr-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## gittr Android (`space.gittr.app`)

            Standalone wrapper around **https://gittr.space** (same hosted forge as the PWA). Not an offline self-hosted copy.

            - Sign in with **Amber / NIP-46** — browser extensions are not available in this APK.
            - Install the `.apk` below, or announce this tag from the gittr repo **Releases** tab (NIP-82 / Zapstore).
            - Self-hosters still clone the git repo; this package always opens gittr.space.

            See `android-app/README.md` and `zapstore.yaml`.
          token: ${{ secrets.GITHUB_TOKEN }}
