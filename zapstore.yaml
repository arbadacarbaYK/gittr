# Zapstore / other Nostr app stores: index GitHub Releases that attach an APK.
# Tag v* → .github/workflows/build-apk.yml uploads gittr-<version>.apk
# Official listing is 1.0.0+ (tag v1.0.0). Do not cut 0.x tags now that gittr is on Zapstore.
#
# First publish (whitelist): commit this file, then from a machine with your
# signer run:  SIGN_WITH=nsec1…  zsp publish -y zapstore.yaml
# Or announce the same GitHub tag from gittr.space Releases / Nostr Apps.
# Do not put an nsec in CI.

name: gittr
summary: Decentralized and discoverable Nostr gits, apps and pages
description: >
  gittr is a hosted Nostr git forge. This Android package opens
  https://gittr.space in a standalone window. Sign in with Amber or another
  NIP-46 remote signer. Self-hosters install from the git repository instead.
repository: https://github.com/arbadacarbaYK/gittr
homepage: https://gittr.space
license: AGPL-3.0
icon: ui/public/android-chrome-512x512.png
# Phone screenshots (kind 32267 `image` tags). 1080×1920 (9:16).
# First three filenames are the live NIP-82 URLs — do not rename them:
#   home.png = repo Code tab, apps.png = Apps, repo.png = Pages.
# Then Repos list + Appearance. Narrow-desktop captures, full width kept
# (a 9:16 side-crop cut titles). Pad to phone height instead.
images:
  - ui/public/zapstore/home.png
  - ui/public/zapstore/apps.png
  - ui/public/zapstore/repo.png
  - ui/public/zapstore/explore.png
  - ui/public/zapstore/appearance.png
pubkey: npub1n2ph08n4pqz4d3jk6n2p35p2f4ldhc5g5tu7dhftfpueajf4rpxqfjhzmc
tags:
  - git
  - nostr
  - bitcoin
  - lightning
