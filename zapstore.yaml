# First publish (whitelist): commit this file, then from a machine with your
# signer run:  SIGN_WITH=nsec1…  zsp publish -y zapstore.yaml
# Or announce the same GitHub tag from gittr.space Releases / Nostr Apps.
# Do not put an nsec in CI.

