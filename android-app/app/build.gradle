plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def versionProps = new Properties()
def versionFile = rootProject.file("version.properties")
if (versionFile.exists()) {
    versionFile.withInputStream { versionProps.load(it) }
}
def versionNameProp = project.findProperty("versionName") ?: versionProps.getProperty("versionName", "0.0.0-dev")
def versionCodeProp = (project.findProperty("versionCode") ?: versionProps.getProperty("versionCode", "1")) as int
// F-Droid must get an unsigned APK and sign it themselves. Zapstore CI opts in.
def signRelease = project.hasProperty("signWithCiKeystore") || System.getenv("ANDROID_KEYSTORE_FILE")

android {
    namespace "space.gittr.app"
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "space.gittr.app"
        minSdk 26
        targetSdk 35
        versionCode versionCodeProp
        versionName versionNameProp
    }

    signingConfigs {
        release {
            def store = file("../keystore/gittr-ci.p12")
            def override = System.getenv("ANDROID_KEYSTORE_FILE")
            if (override) {
                store = file(override)
            }
            storeFile store
            storeType "pkcs12"
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: "gittr-android-ci"
            keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "gittr"
            keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: "gittr-android-ci"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signRelease) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            signingConfig signingConfigs.release
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity-ktx:1.9.3"
    implementation "androidx.core:core-ktx:1.15.0"
}
