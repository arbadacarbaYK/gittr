IssueTracker: https://github.com/arbadacarbaYK/gittr/issues
Changelog: https://github.com/arbadacarbaYK/gittr/releases

RepoType: git
Repo: https://github.com/arbadacarbaYK/gittr.git

Builds:
  - versionName: '1.0.2'
    versionCode: 10200
    commit: v1.0.2
    subdir: android-app
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-release-unsigned.apk
    scanignore:
      - android-app/keystore/gittr-ci.p12

MaintainerNotes: |
  Listing text and screenshots live in android-app/fastlane/metadata/android/en-US/.
  versionName and versionCode are in android-app/version.properties.
  Do not pass -PsignWithCiKeystore. That flag is only for the Zapstore CI key.
  F-Droid must ship the unsigned APK and sign it with the F-Droid key.
  Installs from org.fdroid.fdroid open ?source=fdroid and do not offer the GitHub APK download.

AutoUpdateMode: None
UpdateCheckMode: Tags
UpdateCheckData: android-app/version.properties|versionName=(.*)|.|versionCode=(.*)
