# Include from http {} (Ubuntu: /etc/nginx/conf.d/).
# Rate-limit Meta *training/fetch* crawlers as one global bucket — not per IP
# (gittr.space sits behind Cloudflare, so $binary_remote_addr is the CF edge
# and per-IP limits would 429 real users).
#
# Empty key = not limited: humans, facebookexternalhit (share previews),
# GPTBot, ClaudeBot, Bytespider, Semrush, etc.
map $http_user_agent $meta_ai_limit_key {
    default "";
    ~*meta-externalagent "meta-ai";
    ~*meta-externalfetcher "meta-ai";
}

# ~4 HTML pages/sec for the whole Meta AI crawler fleet. Nest URLs are 404'd
# separately; this is the backstop when they crawl "real" paths too fast.
limit_req_zone $meta_ai_limit_key zone=meta_ai:1m rate=4r/s;
